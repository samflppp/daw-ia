[project]
name = "daw-services"
version = "0.1.0"
description = "Python services for DAW IA: MCP server, harmonic engine, conditioning, IAProvider."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
daw-services = "daw_services.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daw_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
