[project]
name = "daw-services"
version = "0.1.0"
description = "Python services for DAW IA: MCP server, harmonic engine, conditioning, IAProvider."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
]

# The stem separator's models (S22): installed by the DAW the first time a
# separation is asked for (`uv sync --extra stems`), never by the CI.
[project.optional-dependencies]
stems = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.1",
    "soundfile>=0.12",
]
# The push-to-talk's transcriber (S25): installed by the DAW the first time
# the key is held (`uv sync --extra voix`), never by the CI. No PyTorch.
# sherpa-onnx declares its native core dynamically, which the lock does not
# see: it is named here, at the same version.
voix = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[project.scripts]
daw-services = "daw_services.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# The test set's error rates (tools/voix_essai.py), on this machine only.
voix-essai = [
    "jiwer>=4",
    "text2num>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daw_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# Windows is the only target, Linux runs the CI: the lock is resolved for
# those two and no other.
[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# PyTorch for the CPU only: the CUDA wheels weigh gigabytes, and the DAW
# targets laptops without a graphics card (S22).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
