name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: formatting, hygiene rules, workspace manifests.
  # ---------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      # From PyPI, not apt: `apt-get update` hung this job ten minutes at a
      # time (three times on 7 October 2026). 18.1.8 is the version the
      # machine formats with, and the one Ubuntu 24.04 packaged.
      - name: Install clang-format
        run: |
          uv tool install clang-format==18.1.8
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: clang-format
        run: ./scripts/check-format.sh

      - name: Hygiene rules (tokens, layout, domain isolation)
        run: python3 scripts/check_hygiene.py

      - name: Validate workspace manifests
        run: uv run --no-project --with jsonschema python scripts/validate_workspaces.py

  # ---------------------------------------------------------------------------
  # Python services.
  # ---------------------------------------------------------------------------
  services:
    name: Services (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Native core: JUCE + Tracktion Engine app, domain library and tests.
  # ---------------------------------------------------------------------------
  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-24.04
            preset: linux-clang-release
          - name: windows-msvc
            os: windows-2022
            preset: windows-msvc-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Submodules (pinned, non-recursive)
        shell: bash
        run: ./scripts/bootstrap-submodules.sh

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-ubuntu.sh --ci

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@v4.4.2

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Cache stats
        if: always()
        run: sccache --show-stats
