name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: formatting, hygiene rules, workspace manifests.
  # ---------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      # From PyPI, not apt: `apt-get update` hung this job ten minutes at a
      # time (three times on 7 October 2026). 18.1.8 is the version the
      # machine formats with, and the one Ubuntu 24.04 packaged.
      - name: Install clang-format
        run: |
          uv tool install clang-format==18.1.8
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: clang-format
        run: ./scripts/check-format.sh

      - name: Hygiene rules (tokens, layout, domain isolation)
        run: python3 scripts/check_hygiene.py

      - name: Validate workspace manifests
        run: uv run --no-project --with jsonschema python scripts/validate_workspaces.py

  # ---------------------------------------------------------------------------
  # Python services.
  # ---------------------------------------------------------------------------
  services:
    name: Services (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Native core: JUCE + Tracktion Engine app, domain library and tests.
  # ---------------------------------------------------------------------------
  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-24.04
            preset: linux-clang-release
          - name: windows-msvc
            os: windows-2022
            preset: windows-msvc-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Submodules (pinned, non-recursive)
        shell: bash
        run: ./scripts/bootstrap-submodules.sh

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-ubuntu.sh --ci

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@v4.4.2

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Cache stats
        if: always()
        run: sccache --show-stats

      # The push-to-talk from the key to the project (S25, decided on
      # 8 October 2026): the transcriber replays the test set's text and the
      # copilot answers from a table. No weights, no key, no microphone.
      - uses: astral-sh/setup-uv@v10.1.0
        if: runner.os == 'Windows'

      # Once before the run: the copilot is started by `uv run`, and a cold
      # first `uv run` on the runner once took more than the run's minute
      # (8 October 2026).
      - name: Services environment (Windows)
        if: runner.os == 'Windows'
        run: |
          uv sync --locked --project services
          uv run --project services daw-services --help

      - name: --verify-voix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $root = Join-Path $env:RUNNER_TEMP "verify-voix"
          New-Item -ItemType Directory -Force $root | Out-Null
          $exe = "build/windows-msvc-release/core/app/daw_app_artefacts/Release/DAW IA.exe"
          $arguments = "--verify-voix `"$root/verif`" --project `"$root/projet`" --layout `"$root/layout.xml`""
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(1200000)) { $process.Kill(); throw "--verify-voix did not finish in 20 minutes" }
          $report = Join-Path $root "verif/rapport.md"
          if (-not (Test-Path $report)) { throw "no report: the run did not reach its end" }
          Get-Content $report -Encoding utf8
          if (-not (Select-String -Path $report -Pattern " 0 en échec" -Quiet -Encoding utf8)) { throw "--verify-voix failed" }

      # One folder for the artifact: the report and the application's log.
      - name: --verify-voix log
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "DAW IA/daw.log"
          $folder = Join-Path $env:RUNNER_TEMP "verify-voix/verif"
          if ((Test-Path $log) -and (Test-Path $folder)) { Copy-Item $log $folder }

      - name: --verify-voix report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: verify-voix
          path: |
            ${{ runner.temp }}/verify-voix/verif/rapport.md
            ${{ runner.temp }}/verify-voix/verif/daw.log
          if-no-files-found: ignore
